<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnakeScan – 2m Band Scanner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root { --bg: #0b0f14; --card: #121821; --ink: #e8f0ff; --muted: #9bb0ca; --accent: #4cc9f0; --ok: #7ee787; --warn: #f2cc60; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); display: grid; place-items: center; min-height: 100vh; }
      .card { background: var(--card); padding: 24px; border-radius: 12px; width: min(680px, 92vw); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
      h1 { margin: 0 0 16px; font-size: 22px; font-weight: 600; letter-spacing: 0.2px; }
      .row { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
      .freq { font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 700; letter-spacing: 0.5px; }
      .meta { color: var(--muted); font-size: 13px; }
      button { appearance: none; border: 0; border-radius: 10px; padding: 12px 16px; font-size: 16px; font-weight: 600; cursor: pointer; color: #061017; background: var(--accent); }
      button.secondary { background: #243041; color: var(--ink); }
      .pill { display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
      .pill.on { background: rgba(126,231,135,0.15); color: var(--ok); }
      .pill.off { background: rgba(242,204,96,0.15); color: var(--warn); }
      .grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-top: 16px; }
      .stat { background: #0e141c; border-radius: 10px; padding: 12px; }
      .stat .k { color: var(--muted); font-size: 12px; }
      .stat .v { font-variant-numeric: tabular-nums; font-weight: 700; }
      /* Tabs */
      .tabs { display: flex; gap: 0; margin-top: 16px; border-bottom: 2px solid #1e2a38; }
      .tab { padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -2px; }
      .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
      .tab-content { display: none; margin-top: 16px; }
      .tab-content.active { display: block; }
      #heatmap-canvas { width: 100%; height: 300px; background: #0e141c; border-radius: 8px; cursor: crosshair; }
      #map { width: 100%; height: 350px; border-radius: 8px; }
      .heatmap-legend { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
      .heatmap-legend .swatch { width: 16px; height: 12px; border-radius: 2px; }
      .export-link { color: var(--accent); text-decoration: none; font-size: 13px; }
      .export-link:hover { text-decoration: underline; }
      footer { margin-top: 16px; color: var(--muted); font-size: 12px; text-align: right; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>SnakeScan – 2m Band</h1>
      <div class="row" style="margin-bottom: 12px;">
        <div>
          <div id="freq" class="freq">144.000 MHz</div>
          <div class="meta">
            <span id="status-pill" class="pill off">Stopped</span>
            <span>&bull;</span>
            <span id="meta">Dwell 0.50s &bull; 0/0</span>
          </div>
        </div>
        <div class="row" style="gap: 8px;">
          <button id="toggle">Start</button>
          <button id="stop" class="secondary">Stop</button>
          <button id="hold" class="secondary">Hold 3s</button>
          <button id="bookmark" class="secondary">Bookmark</button>
          <button id="geo" class="secondary">Geo OFF</button>
        </div>
      </div>

      <div class="grid">
        <div class="stat"><div class="k">Current index</div><div class="v" id="idx">0</div></div>
        <div class="stat"><div class="k">Total freqs</div><div class="v" id="total">0</div></div>
        <div class="stat"><div class="k">Dwell (s)</div><div class="v" id="dwell">0.50</div></div>
        <div class="stat"><div class="k">Running</div><div class="v" id="running">false</div></div>
        <div class="stat"><div class="k">Hold</div><div class="v" id="holdrem">0.00</div></div>
        <div class="stat"><div class="k">Location</div><div class="v" id="loc">&mdash;</div></div>
        <div class="stat"><div class="k">Grid Square</div><div class="v" id="grid">&mdash;</div></div>
        <div class="stat"><div class="k">GPS Accuracy</div><div class="v" id="accuracy">&mdash;</div></div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="scanner">Scanner</button>
        <button class="tab" data-tab="history">History</button>
        <button class="tab" data-tab="map">Map</button>
      </div>

      <div id="tab-scanner" class="tab-content active">
        <!-- Scanner tab is the default live view (status grid above) -->
      </div>

      <div id="tab-history" class="tab-content">
        <canvas id="heatmap-canvas"></canvas>
        <div class="heatmap-legend">
          <span>Hits:</span>
          <span class="swatch" style="background:#1a1a2e"></span><span>0</span>
          <span class="swatch" style="background:#16213e"></span><span>1</span>
          <span class="swatch" style="background:#0f3460"></span><span>2-3</span>
          <span class="swatch" style="background:#533483"></span><span>4-7</span>
          <span class="swatch" style="background:#e94560"></span><span>8+</span>
          <a href="/api/export/csv" class="export-link" style="margin-left:auto">Export CSV</a>
        </div>
      </div>

      <div id="tab-map" class="tab-content">
        <div id="map"></div>
      </div>

      <div style="margin-top: 16px;">
        <div class="meta" style="margin-bottom: 6px;">Spectrum / Waterfall</div>
        <canvas id="spectrum" width="640" height="120" style="width:100%; display:block; border-radius:8px 8px 0 0; cursor:crosshair; background:#0a0e14;"></canvas>
        <canvas id="waterfall" width="640" height="200" style="width:100%; display:block; border-radius:0 0 8px 8px; cursor:crosshair; background:#0a0e14;"></canvas>
      </div>

      <footer>
        SnakeScan &ndash; updates ~4&times;/sec
      </footer>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const freqEl = $('freq');
      const metaEl = $('meta');
      const idx = $('idx');
      const total = $('total');
      const dwellEl = $('dwell');
      const runningEl = $('running');
      const holdrem = $('holdrem');
      const loc = $('loc');
      const gridEl = $('grid');
      const accuracyEl = $('accuracy');
      const toggleBtn = $('toggle');
      const stopBtn = $('stop');
      const holdBtn = $('hold');
      const bookmarkBtn = $('bookmark');
      const geoBtn = $('geo');
      let voiceOn = false;
      let lastSpokenFreq = null;
      const pill = $('status-pill');

      function updateUI(j) {
        freqEl.textContent = j.current_freq_str || '\u2014';
        idx.textContent = j.index ?? 0;
        total.textContent = j.total_freqs ?? 0;
        dwellEl.textContent = (j.dwell_seconds ?? 0).toFixed(2);
        runningEl.textContent = j.running ? 'true' : 'false';
        holdrem.textContent = (j.hold_remaining ?? 0).toFixed(2);
        if (j.location) {
          const lat = (+j.location.lat).toFixed(5);
          const lon = (+j.location.lon).toFixed(5);
          loc.textContent = `${lat}, ${lon}`;
          gridEl.textContent = j.location.grid_square || '\u2014';
          accuracyEl.textContent = j.location.accuracy ? `${(+j.location.accuracy).toFixed(0)}m` : '\u2014';
        } else {
          loc.textContent = '\u2014';
          gridEl.textContent = '\u2014';
          accuracyEl.textContent = '\u2014';
        }
        metaEl.textContent = `Dwell ${(+j.dwell_seconds).toFixed(2)}s \u2022 ${j.index+1}/${j.total_freqs}`;
        toggleBtn.textContent = j.running ? 'Pause' : 'Start';
        pill.textContent = j.running ? (j.active ? 'Active' : 'Running') : 'Stopped';
        pill.className = 'pill ' + (j.running ? 'on' : 'off');
      }

      async function getStatus() {
        const res = await fetch('/api/status', { cache: 'no-store' });
        if (!res.ok) return;
        updateUI(await res.json());
      }

      async function post(url, body) {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : null,
        });
        return res.json();
      }

      toggleBtn.addEventListener('click', async () => { await post('/api/toggle'); await getStatus(); });
      stopBtn.addEventListener('click', async () => { await post('/api/stop'); await getStatus(); });
      holdBtn.addEventListener('click', async () => { await post('/api/hold', { seconds: 3 }); await getStatus(); });
      bookmarkBtn.addEventListener('click', async () => {
        const note = prompt('Optional note/tag for this bookmark:') || undefined;
        const payload = note ? { note } : undefined;
        await post('/api/bookmark', payload);
        bookmarkBtn.textContent = 'Bookmarked';
        setTimeout(() => (bookmarkBtn.textContent = 'Bookmark'), 900);
      });

      // Voice toggle via double-tap on the frequency display
      freqEl.addEventListener('dblclick', () => {
        voiceOn = !voiceOn;
        freqEl.style.textDecoration = voiceOn ? 'underline' : '';
        if (voiceOn && window.speechSynthesis) {
          const u = new SpeechSynthesisUtterance('Voice alerts on');
          speechSynthesis.speak(u);
        }
      });

      // Prefer SSE for low-latency updates; fall back to polling
      function setupEvents() {
        if (!('EventSource' in window)) return false;
        try {
          const es = new EventSource('/api/events');
          es.addEventListener('status', (ev) => { updateUI(JSON.parse(ev.data)); });
          es.addEventListener('activity', (ev) => {
            if (!voiceOn || !window.speechSynthesis) return;
            const d = JSON.parse(ev.data);
            const text = String(d.freq || '').replace('MHz', ' mega hertz');
            speechSynthesis.cancel();
            speechSynthesis.speak(new SpeechSynthesisUtterance('Active ' + text + ', holding'));
          });
          return true;
        } catch (_) { return false; }
      }

      if (!setupEvents()) {
        getStatus();
        setInterval(async () => {
          await getStatus();
          if (!voiceOn || !window.speechSynthesis) return;
          const f = freqEl.textContent;
          if (f && f !== lastSpokenFreq && runningEl.textContent === 'true') {
            lastSpokenFreq = f;
            const text = f.replace('MHz', ' mega hertz');
            speechSynthesis.cancel();
            speechSynthesis.speak(new SpeechSynthesisUtterance(text));
          }
        }, 250);
      }

      // Geo (optional)
      let geoWatchId = null;
      function geoOn() {
        if (!('geolocation' in navigator)) return alert('No geolocation available');
        geoBtn.textContent = 'Geo ON';
        geoWatchId = navigator.geolocation.watchPosition((pos) => {
          const c = pos.coords || {};
          post('/api/geo', { lat: c.latitude, lon: c.longitude, accuracy: c.accuracy, speed: c.speed, heading: c.heading }).catch(()=>{});
        }, (err) => { console.warn('geo error', err); },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 8000 });
      }
      function geoOff() {
        geoBtn.textContent = 'Geo OFF';
        if (geoWatchId != null && navigator.geolocation) navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
      }
      geoBtn.addEventListener('click', () => { if (geoWatchId == null) geoOn(); else geoOff(); });

      // ---- Tab switching ----
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          const target = tab.getAttribute('data-tab');
          $('tab-' + target).classList.add('active');
          if (target === 'history') loadHeatmap();
          if (target === 'map') loadMap();
        });
      });

      // ---- FFT Spectrum & Waterfall ----
      const specCanvas = $('spectrum');
      const wfCanvas = $('waterfall');
      const specCtx = specCanvas.getContext('2d');
      const wfCtx = wfCanvas.getContext('2d');
      const FFT_W = 640, SPEC_H = 120, WF_H = 200;

      // Inferno palette (256 RGB entries via linear interpolation)
      const infernoPalette = (function() {
        const stops = [
          [0, 0, 0, 4], [32, 31, 12, 72], [64, 82, 13, 110],
          [96, 138, 37, 97], [128, 189, 70, 60], [160, 228, 114, 22],
          [192, 248, 171, 14], [224, 243, 229, 80], [255, 252, 255, 164]
        ];
        const p = [];
        for (let i = 0; i < 256; i++) {
          let lo = stops[0], hi = stops[stops.length - 1];
          for (let s = 0; s < stops.length - 1; s++) {
            if (i >= stops[s][0] && i <= stops[s + 1][0]) {
              lo = stops[s]; hi = stops[s + 1]; break;
            }
          }
          const t = lo[0] === hi[0] ? 0 : (i - lo[0]) / (hi[0] - lo[0]);
          p.push([
            Math.round(lo[1] + t * (hi[1] - lo[1])),
            Math.round(lo[2] + t * (hi[2] - lo[2])),
            Math.round(lo[3] + t * (hi[3] - lo[3]))
          ]);
        }
        return p;
      })();

      // Waterfall image buffer
      const wfImg = wfCtx.createImageData(FFT_W, WF_H);
      for (let i = 3; i < wfImg.data.length; i += 4) wfImg.data[i] = 255;

      function drawSpectrum(data) {
        const { bins, power_db } = data;
        const n = power_db.length;
        if (!n) return;
        const dbMin = Math.min(...power_db);
        const dbMax = Math.max(...power_db);
        const range = Math.max(dbMax - dbMin, 10);

        specCtx.clearRect(0, 0, FFT_W, SPEC_H);

        // Grid lines
        specCtx.strokeStyle = '#1a2535';
        specCtx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = Math.round((i / 4) * SPEC_H) + 0.5;
          specCtx.beginPath(); specCtx.moveTo(0, y); specCtx.lineTo(FFT_W, y); specCtx.stroke();
        }

        // Spectrum line
        specCtx.strokeStyle = '#4cc9f0';
        specCtx.lineWidth = 1.5;
        specCtx.beginPath();
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * FFT_W;
          const y = SPEC_H - ((power_db[i] - dbMin) / range) * (SPEC_H - 10) - 5;
          if (i === 0) specCtx.moveTo(x, y); else specCtx.lineTo(x, y);
        }
        specCtx.stroke();

        // Peak marker
        let peakIdx = 0;
        for (let i = 1; i < n; i++) {
          if (power_db[i] > power_db[peakIdx]) peakIdx = i;
        }
        const px = (peakIdx / (n - 1)) * FFT_W;
        const py = SPEC_H - ((power_db[peakIdx] - dbMin) / range) * (SPEC_H - 10) - 5;
        specCtx.fillStyle = '#f44';
        specCtx.beginPath(); specCtx.arc(px, py, 4, 0, Math.PI * 2); specCtx.fill();
        specCtx.font = '11px system-ui';
        specCtx.fillText((bins[peakIdx] / 1e6).toFixed(3) + ' MHz', px + 6, py - 4);
      }

      function drawWaterfall(data) {
        const { power_db } = data;
        const n = power_db.length;
        if (!n) return;
        const dbMin = Math.min(...power_db);
        const dbMax = Math.max(...power_db);
        const range = Math.max(dbMax - dbMin, 10);

        // Scroll existing rows down by 1
        const d = wfImg.data;
        const rowBytes = FFT_W * 4;
        d.copyWithin(rowBytes, 0, rowBytes * (WF_H - 1));

        // Write new row at top (row 0)
        for (let x = 0; x < FFT_W; x++) {
          const binIdx = Math.min(n - 1, Math.round((x / (FFT_W - 1)) * (n - 1)));
          const t = Math.max(0, Math.min(1, (power_db[binIdx] - dbMin) / range));
          const [r, g, b] = infernoPalette[Math.round(t * 255)];
          const off = x * 4;
          d[off] = r; d[off + 1] = g; d[off + 2] = b; d[off + 3] = 255;
        }
        wfCtx.putImageData(wfImg, 0, 0);
      }

      // Click-to-tune on spectrum or waterfall canvas
      function clickToTune(e) {
        const rect = e.target.getBoundingClientRect();
        const xRatio = (e.clientX - rect.left) / rect.width;
        const freq = 144000000 + xRatio * (148000000 - 144000000);
        post('/api/set_freq', { freq_hz: Math.round(freq) });
      }
      specCanvas.addEventListener('click', clickToTune);
      wfCanvas.addEventListener('click', clickToTune);

      // FFT polling (1 Hz via requestAnimationFrame)
      let fftLastMs = 0;
      function fftPoll(ts) {
        if (ts - fftLastMs >= 1000) {
          fftLastMs = ts;
          fetch('/api/fft', { cache: 'no-store' })
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.bins && d.bins.length) {
                drawSpectrum(d);
                drawWaterfall(d);
              }
            })
            .catch(() => {});
        }
        requestAnimationFrame(fftPoll);
      }
      requestAnimationFrame(fftPoll);

      // ---- History: Time x Frequency Heatmap (Canvas) ----
      const heatColors = ['#1a1a2e','#16213e','#0f3460','#533483','#e94560'];
      function countToColor(n) {
        if (n <= 0) return heatColors[0];
        if (n === 1) return heatColors[1];
        if (n <= 3) return heatColors[2];
        if (n <= 7) return heatColors[3];
        return heatColors[4];
      }

      async function loadHeatmap() {
        const canvas = $('heatmap-canvas');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        const W = rect.width, H = rect.height;
        ctx.fillStyle = '#0e141c';
        ctx.fillRect(0, 0, W, H);

        let data;
        try {
          const res = await fetch('/api/heatmap/frequency');
          data = await res.json();
        } catch (e) { return; }

        const { buckets, freqs, counts } = data;
        if (!buckets.length || !freqs.length) {
          ctx.fillStyle = '#9bb0ca';
          ctx.font = '14px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('No event data yet', W/2, H/2);
          return;
        }

        const marginL = 70, marginB = 40, marginT = 10, marginR = 10;
        const plotW = W - marginL - marginR;
        const plotH = H - marginT - marginB;
        const cellW = plotW / buckets.length;
        const cellH = plotH / freqs.length;

        // Draw cells
        for (let fi = 0; fi < freqs.length; fi++) {
          for (let bi = 0; bi < buckets.length; bi++) {
            ctx.fillStyle = countToColor(counts[fi][bi]);
            ctx.fillRect(marginL + bi * cellW, marginT + fi * cellH, Math.ceil(cellW), Math.ceil(cellH));
          }
        }

        // Y axis labels (freq)
        ctx.fillStyle = '#9bb0ca';
        ctx.font = '10px system-ui';
        ctx.textAlign = 'right';
        const yStep = Math.max(1, Math.floor(freqs.length / 8));
        for (let fi = 0; fi < freqs.length; fi += yStep) {
          const y = marginT + fi * cellH + cellH / 2;
          ctx.fillText((freqs[fi] / 1e6).toFixed(2), marginL - 4, y + 3);
        }

        // X axis labels (time)
        ctx.textAlign = 'center';
        const xStep = Math.max(1, Math.floor(buckets.length / 6));
        for (let bi = 0; bi < buckets.length; bi += xStep) {
          const x = marginL + bi * cellW + cellW / 2;
          const label = buckets[bi].slice(11, 16) || buckets[bi].slice(0, 10);
          ctx.fillText(label, x, H - marginB + 14);
        }

        // Axis titles
        ctx.save();
        ctx.translate(12, marginT + plotH / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.fillText('Frequency (MHz)', 0, 0);
        ctx.restore();
        ctx.textAlign = 'center';
        ctx.fillText('Time', marginL + plotW / 2, H - 4);
      }

      // ---- Map tab: Leaflet.js ----
      let leafletMap = null;
      let mapMarkers = [];

      function freqToHue(fhz) {
        // Map 144-148 MHz to hue 0-270
        const mhz = fhz / 1e6;
        return ((mhz - 144) / 4) * 270;
      }

      async function loadMap() {
        const container = $('map');
        if (!leafletMap) {
          leafletMap = L.map(container).setView([39.8, -98.5], 4);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 18,
          }).addTo(leafletMap);
        }
        setTimeout(() => leafletMap.invalidateSize(), 100);

        // Clear old markers
        mapMarkers.forEach(m => leafletMap.removeLayer(m));
        mapMarkers = [];

        let geo;
        try {
          const res = await fetch('/api/heatmap/geo');
          geo = await res.json();
        } catch (e) { return; }

        if (!geo.features || !geo.features.length) return;

        const bounds = [];
        geo.features.forEach(f => {
          const [lon, lat] = f.geometry.coordinates;
          const p = f.properties;
          const hue = freqToHue(p.freq_hz);
          const radius = Math.min(5 + p.count * 2, 20);
          const marker = L.circleMarker([lat, lon], {
            radius: radius,
            fillColor: `hsl(${hue}, 80%, 55%)`,
            color: `hsl(${hue}, 80%, 35%)`,
            weight: 1,
            fillOpacity: 0.7,
          }).addTo(leafletMap);
          marker.bindTooltip(
            `<b>${(p.freq_hz/1e6).toFixed(3)} MHz</b><br>Hits: ${p.count}<br>Last: ${p.last_seen || '?'}<br>Grid: ${p.grid_square || '?'}`,
            { direction: 'top' }
          );
          mapMarkers.push(marker);
          bounds.push([lat, lon]);
        });

        if (bounds.length) leafletMap.fitBounds(bounds, { padding: [30, 30] });
      }
    </script>
  </body>
</html>
